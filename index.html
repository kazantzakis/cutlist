<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CutList Optimizer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
    CutList Optimizer
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" id="btn-calculate" onclick="calculate()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Calculate
    </button>
    <button class="btn btn-sm btn-default" onclick="saveToLocalStorage()">Save</button>
    <button class="btn btn-sm btn-default" onclick="loadFromLocalStorage()">Load</button>
    <button class="btn btn-sm btn-default" onclick="resetAll()">Reset</button>
  </div>
</div>

<div id="status-message"><div class="spinner"></div><span id="status-text">Calculating...</span></div>

<div id="main">
  <!-- Left Sidebar -->
  <div id="sidebar">
    <!-- Panels Input -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Panels
        <span class="arrow">▼</span>
      </div>
      <div class="section-body" id="panels-body">
        <table class="input-table">
          <thead><tr>
            <th style="width:52px">Width</th>
            <th style="width:52px">Height</th>
            <th style="width:36px">Qty</th>
            <th style="width:56px">Label</th>
            <th style="width:52px">Material</th>
            <th style="width:40px">Rot</th>
            <th style="width:20px"></th>
          </tr></thead>
          <tbody id="panels-tbody">
          </tbody>
        </table>
        <button class="btn btn-sm btn-default" style="margin-top:6px" onclick="addPanelRow()">+ Add Panel</button>
        <button class="btn btn-sm btn-default" style="margin-top:6px;margin-left:4px" onclick="addSamplePanels()">Sample</button>
      </div>
    </div>

    <!-- Stock Input -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
        Stock Sheets
        <span class="arrow">▼</span>
      </div>
      <div class="section-body" id="stock-body">
        <table class="input-table">
          <thead><tr>
            <th style="width:52px">Width</th>
            <th style="width:52px">Height</th>
            <th style="width:36px">Qty</th>
            <th style="width:56px">Label</th>
            <th style="width:20px"></th>
          </tr></thead>
          <tbody id="stock-tbody">
          </tbody>
        </table>
        <button class="btn btn-sm btn-default" style="margin-top:6px" onclick="addStockRow()">+ Add Stock</button>
        <button class="btn btn-sm btn-default" style="margin-top:6px;margin-left:4px" onclick="addSampleStock()">Sample</button>
      </div>
    </div>

    <!-- Options -->
    <div class="section">
      <div class="section-header" onclick="toggleSection(this)">
        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg>
        Options
        <span class="arrow">▼</span>
      </div>
      <div class="section-body" id="options-body">
        <div class="option-row">
          <label>Cut Thickness (kerf)</label>
          <input type="number" id="opt-kerf" value="3" min="0" step="1">
        </div>
        <div class="option-row">
          <label>Show Labels</label>
          <label class="toggle"><input type="checkbox" id="opt-labels" checked onchange="toggleLabels()"><span class="slider"></span></label>
        </div>
        <div class="option-row">
          <label>Show Dimensions</label>
          <label class="toggle"><input type="checkbox" id="opt-dimensions" onchange="toggleDimensions()"><span class="slider"></span></label>
        </div>
        <div class="option-row">
          <label>Enable Materials</label>
          <label class="toggle"><input type="checkbox" id="opt-materials"><span class="slider"></span></label>
        </div>
        <div class="option-row">
          <label>Edge Banding</label>
          <label class="toggle"><input type="checkbox" id="opt-edgeband"><span class="slider"></span></label>
        </div>
        <div class="option-row">
          <label>Dark Theme</label>
          <label class="toggle"><input type="checkbox" id="opt-theme" checked onchange="toggleTheme()"><span class="slider"></span></label>
        </div>
        <div class="option-row">
          <label>Group Identical Sheets</label>
          <label class="toggle"><input type="checkbox" id="opt-group" checked><span class="slider"></span></label>
        </div>
        <div class="option-row">
          <label>Optimization Priority</label>
          <select id="opt-priority">
            <option value="material">Material Usage</option>
            <option value="cuts">Fewer Cuts</option>
            <option value="balance" selected>Balanced</option>
          </select>
        </div>
        <div class="option-row">
          <label>Units</label>
          <select id="opt-units" onchange="toggleUnits()">
            <option value="mm">mm</option>
            <option value="cm">cm</option>
          </select>
        </div>
        <div class="option-row">
          <label>Cut Type</label>
          <select id="opt-cuttype" onchange="onCutTypeChange()">
            <option value="free">Free Cuts</option>
            <option value="guillotine">Guillotine Cuts</option>
          </select>
        </div>
        <div class="option-row">
          <label>Algorithm</label>
          <select id="opt-algorithm" onchange="onAlgorithmChange()">
          </select>
        </div>

      </div>
    </div>
  </div>
  <div id="sidebar-resize-handle"></div>

  <!-- Canvas -->
  <div id="content">
    <div id="canvas-area">
      <div id="svg-canvas"></div>
    </div>
  </div>

  <!-- Right Panel -->
  <div id="right-panel">
    <div style="padding:14px;overflow-y:auto;height:100%">
      <!-- Sheet navigation -->
      <div class="sheet-nav" id="sheet-nav" style="display:none">
        <button onclick="prevSheet()">‹</button>
        <span id="sheet-indicator">1 / 1</span>
        <button onclick="nextSheet()">›</button>
      </div>

      <!-- Overall stats -->
      <div id="overall-stats" style="display:none">
        <h4 style="font-size:13px;margin-bottom:8px">Overall Statistics</h4>
        <div class="stats-grid" id="stats-grid"></div>
      </div>

      <!-- Sheet stats -->
      <div id="sheet-stats" style="display:none;margin-top:16px">
        <h4 style="font-size:13px;margin-bottom:8px">Sheet Details</h4>
        <div class="stats-grid" id="sheet-stats-grid"></div>
      </div>

      <!-- No fit panels -->
      <div id="no-fit-section" style="display:none" class="no-fit-panel">
        <h4>⚠ Unable to Fit</h4>
        <table class="no-fit-table"><thead><tr><th>Panel</th><th>Label</th><th>Qty</th></tr></thead><tbody id="no-fit-body"></tbody></table>
      </div>

      <!-- Cuts -->
      <div id="cuts-section" style="display:none" class="cuts-section">
        <h4>✂ Cuts</h4>
        <div style="max-height:300px;overflow-y:auto">
          <table class="cuts-table"><thead><tr><th>#</th><th>Panel</th><th>Cut</th><th>Result 1</th><th>Result 2</th></tr></thead><tbody id="cuts-body"></tbody></table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
